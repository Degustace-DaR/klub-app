<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥃</text></svg>">
<title>Rum Klub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #EAE2D0;
    --surface: #F7F2E6;
    --surface-2: #FBF8F0;
    --ink: #2B2013;
    --ink-soft: #6B5D46;
    --ink-faint: #948566;
    --line: #D8CBAA;
    --line-strong: #C2B28C;
    --accent: #9C5D18;
    --accent-strong: #7A480F;
    --accent-soft: #E8D2AC;
    --accent-ink: #FFFFFF;
    --good: #3F6E4C;
    --good-soft: #DCE8DA;
    --warn: #A6392A;
    --warn-soft: #F1DAD1;
    --info: #2E5E78;
    --info-soft: #D9E5E9;
    --gold: #B8860B;
    --gold-soft: #F3E3B0;
    --shadow: 0 1px 2px rgba(43,32,19,0.06), 0 6px 20px rgba(43,32,19,0.08);
    --shadow-lg: 0 8px 16px rgba(43,32,19,0.12), 0 24px 48px rgba(43,32,19,0.18);
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B140C; --surface: #241B10; --surface-2: #2C2213;
      --ink: #EFE4CE; --ink-soft: #C1AD87; --ink-faint: #8C7B5C;
      --line: #3C2E1A; --line-strong: #4E3C22;
      --accent: #E0A24E; --accent-strong: #F0BA6D; --accent-soft: #4A3418; --accent-ink: #241B10;
      --good: #8FC49B; --good-soft: #263C2A;
      --warn: #E28A73; --warn-soft: #422620;
      --info: #8BC0D8; --info-soft: #1F3641;
      --gold: #E0BB5C; --gold-soft: #4A3B14;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.35);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4), 0 32px 64px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B140C; --surface: #241B10; --surface-2: #2C2213;
    --ink: #EFE4CE; --ink-soft: #C1AD87; --ink-faint: #8C7B5C;
    --line: #3C2E1A; --line-strong: #4E3C22;
    --accent: #E0A24E; --accent-strong: #F0BA6D; --accent-soft: #4A3418; --accent-ink: #241B10;
    --good: #8FC49B; --good-soft: #263C2A;
    --warn: #E28A73; --warn-soft: #422620;
    --info: #8BC0D8; --info-soft: #1F3641;
    --gold: #E0BB5C; --gold-soft: #4A3B14;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.4), 0 32px 64px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    color: var(--ink); font-family: var(--font-body); line-height: 1.5;
    font-size: 15px; padding-bottom: 84px; min-height: 100vh;
  }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; font-size: inherit; }

  /* ---------- header ---------- */
  header.app-head {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 14px 16px 10px;
  }
  .head-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand { display:flex; align-items:center; gap:9px; }
  .brand-glass { font-size: 22px; line-height:1; }
  .brand-name { font-family: var(--font-display); font-weight:600; font-size:1.25rem; }
  .sync-dot { width:10px; height:10px; border-radius:50%; background: var(--ink-faint); display:inline-block; margin-right:5px; }
  .sync-dot.live { background: var(--good); box-shadow:0 0 0 3px var(--good-soft); }
  .sync-label { font-family: var(--font-mono); font-size:10.5px; color:var(--ink-faint); display:flex; align-items:center; }
  .balance-chip {
    font-family: var(--font-mono); font-size:12.5px; font-weight:500;
    background: var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; color: var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .balance-chip b { color: var(--ink); }
  .balance-chip.neg b { color: var(--warn); }
  .balance-chip.pos b { color: var(--good); }

  /* ---------- tabs ---------- */
  nav.tabs {
    display:flex; gap:4px; overflow-x:auto; margin-top:12px; padding-bottom:2px;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar { display:none; }
  .tab-btn {
    flex: 0 0 auto; display:flex; align-items:center; gap:6px;
    border:1px solid var(--line-strong); background:transparent; color: var(--ink-faint);
    padding:8px 13px; border-radius:999px; font-size:13.5px; font-weight:500; cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tab-btn:not(.active):hover { background: var(--surface); color: var(--ink); }

  main { padding: 14px 14px 8px; max-width: 720px; margin: 0 auto; }
  .view { display:none; }
  .view.active { display:block; }

  h2.view-title { font-family: var(--font-display); font-weight:600; font-size:1.3rem; margin: 4px 0 14px; }
  .muted { color: var(--ink-faint); }
  .empty-note { color: var(--ink-faint); font-size:0.92rem; text-align:center; padding: 30px 10px; }

  /* ---------- form controls ---------- */
  .field { margin-bottom: 12px; }
  .field label { display:block; font-size:12.5px; color: var(--ink-soft); margin-bottom:5px; font-weight:500; }
  .input, select.input, textarea.input {
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink); font-size:15px;
  }
  .input:focus, select.input:focus, textarea.input:focus {
    outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea.input { resize: vertical; min-height: 60px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:9px; padding:11px 18px; font-size:14.5px; font-weight:600;
    cursor:pointer; width:100%;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:active { background: var(--accent-strong); }
  .btn-ghost { background: var(--surface); color: var(--ink-soft); border:1px solid var(--line-strong); }
  .btn-danger { background: var(--warn-soft); color: var(--warn); }
  .btn-sm { width:auto; padding:7px 12px; font-size:13px; }
  .btn-row { display:flex; gap:8px; margin-top: 6px; }
  .btn-row .btn { width:auto; flex:1; }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 10px;
  }

  /* rum leaderboard */
  .search-row { display:flex; gap:8px; margin-bottom: 12px; }
  .search-row .input { flex:1; }
  .search-row select.input { flex: 0 0 auto; width: auto; }
  .rum-card { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .rum-rank { font-family: var(--font-mono); font-size:12px; color: var(--ink-faint); width:20px; text-align:right; flex-shrink:0; }
  .rum-main { flex:1; min-width:0; }
  .rum-name { font-family: var(--font-display); font-weight:600; font-size:1.02rem; }
  .rum-sub { font-size:12.5px; color: var(--ink-faint); margin-top:2px; }
  .origin-badge {
    display:inline-block; font-size:11px; font-family: var(--font-mono);
    background: var(--surface-2); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; color: var(--ink-soft); margin-right:6px;
  }
  .rum-score { text-align:right; flex-shrink:0; }
  .rum-score .num { font-family: var(--font-display); font-weight:700; font-size:1.4rem; }
  .rum-score .cnt { font-size:11px; color: var(--ink-faint); }
  .score-gold { color: var(--gold); }
  .score-good { color: var(--good); }
  .score-mid { color: var(--ink); }
  .score-none { color: var(--ink-faint); font-size: 1rem; }

  /* modal / detail */
  .overlay {
    position:fixed; inset:0; background: rgba(20,14,6,0.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .overlay[hidden] { display:none; }
  .sheet {
    background: var(--bg); width:100%; max-width:720px; max-height: 88vh; overflow-y:auto;
    border-radius: 18px 18px 0 0; box-shadow: var(--shadow-lg); padding: 18px 18px 26px;
  }
  .sheet-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap: 10px;}
  .sheet-close { background:none; border:none; font-size:22px; color: var(--ink-faint); cursor:pointer; line-height:1; padding:4px; }
  .crit-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .crit-label { width: 78px; font-size:12.5px; color: var(--ink-soft); flex-shrink:0; }
  .crit-bar-track { flex:1; height:8px; border-radius:5px; background: var(--surface-2); overflow:hidden; }
  .crit-bar-fill { height:100%; background: var(--accent); border-radius:5px; }
  .crit-val { font-family: var(--font-mono); font-size:12.5px; width:32px; text-align:right; color: var(--ink); }
  .person-chip {
    display:inline-flex; align-items:center; gap:6px; background: var(--surface-2);
    border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:12.5px; margin: 3px 4px 0 0;
  }
  .person-chip b { font-family: var(--font-mono); }

  /* degustace / rating form */
  .picker-list { max-height: 240px; overflow-y:auto; border:1px solid var(--line-strong); border-radius:9px; background:var(--surface-2); margin-top:6px; }
  .picker-item { padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line); font-size:14px; }
  .picker-item:last-child { border-bottom:none; }
  .picker-item:hover { background: var(--surface); }
  .picker-item .sub { font-size:11.5px; color: var(--ink-faint); }
  .selected-chip {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--accent-soft); border-radius:9px; padding:10px 12px; margin-top:6px;
  }
  .selected-chip .x { background:none; border:none; color: var(--ink-soft); font-size:18px; cursor:pointer; }
  .member-chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; }
  .member-chip {
    border:1px solid var(--line-strong); background: var(--surface-2); color: var(--ink);
    border-radius:999px; padding:8px 15px; font-size:14px; cursor:pointer;
  }
  .member-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .slider-row { margin-bottom: 14px; }
  .slider-head { display:flex; justify-content:space-between; font-size:13px; color: var(--ink-soft); margin-bottom:4px; }
  .slider-head b { font-family: var(--font-mono); color: var(--ink); font-size:15px; }
  input[type=range] { width:100%; accent-color: var(--accent); height: 22px; }
  .total-box {
    display:flex; justify-content:space-between; align-items:center;
    background: var(--surface-2); border-radius:9px; padding:12px 14px; margin: 4px 0 14px;
  }
  .total-box .num { font-family: var(--font-display); font-weight:700; font-size:1.6rem; }
  .warn-banner {
    background: var(--warn-soft); color: var(--warn); border-radius:9px; padding:10px 12px;
    font-size:13px; margin-bottom:12px;
  }
  .recent-item { display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--line); }
  .recent-item:last-child { border-bottom:none; }
  .recent-item.clickable { cursor:pointer; }
  .recent-item.clickable:active { background: var(--surface-2, rgba(0,0,0,0.04)); }
  .recent-list-scroll { max-height: 265px; overflow-y: auto; }

  /* ledger */
  .balance-hero { text-align:center; padding: 18px 10px; }
  .balance-hero .num { font-family: var(--font-display); font-weight:700; font-size:2.4rem; }
  .balance-hero .num.neg { color: var(--warn); }
  .balance-hero .num.pos { color: var(--good); }
  .ledger-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; }
  .ledger-row:hover { background: var(--surface-2); margin: 0 -8px; padding-left:8px; padding-right:8px; border-radius:6px; }
  .ledger-row:last-child { border-bottom:none; }
  .ledger-desc { flex:1; min-width:0; }
  .ledger-date { font-size:11px; color: var(--ink-faint); font-family: var(--font-mono); }
  .ledger-amt { font-family: var(--font-mono); font-weight:600; flex-shrink:0; margin-left:10px; }
  .ledger-amt.pos { color: var(--good); }
  .ledger-amt.neg { color: var(--warn); }
  .ledger-bal { font-size:11px; color: var(--ink-faint); display:block; text-align:right; }

  /* wishlist */
  .filter-chips { display:flex; gap:7px; margin-bottom:12px; overflow-x:auto; }
  .filter-chip { flex:0 0 auto; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
    border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer; }
  .filter-chip.active { background: var(--info); border-color:var(--info); color: #fff; }
  .status-pill { font-size:11px; font-family: var(--font-mono); padding:2px 8px; border-radius:999px; }
  .status-kandidat { background: var(--info-soft); color: var(--info); }
  .status-koupeno { background: var(--good-soft); color: var(--good); }
  .status-zamitnuto { background: var(--surface-2); color: var(--ink-faint); }

  /* klub */
  .member-card { display:flex; justify-content:space-between; align-items:center; }
  .member-stats { font-size:12px; color: var(--ink-faint); margin-top:2px; }

  .toast-wrap { position:fixed; bottom: 90px; left:0; right:0; display:flex; justify-content:center; z-index:60; pointer-events:none; }
  .toast {
    background: var(--ink); color: var(--bg); padding:10px 18px; border-radius:999px;
    font-size:13.5px; box-shadow: var(--shadow-lg); opacity:0; transform:translateY(8px);
    transition: all 0.25s ease;
  }
  .toast.show { opacity:1; transform:translateY(0); }

  .offline-note { text-align:center; padding: 60px 20px; color: var(--ink-faint); }
  .offline-note .big { font-size:38px; margin-bottom:10px; }
  [hidden] { display:none !important; }

  /* ---------- PIN zámek appky ---------- */
  .pin-gate {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg); display:flex; align-items:center; justify-content:center; padding: 20px;
  }
  .pin-card {
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); padding: 32px 28px; width:100%; max-width: 320px; text-align:center;
  }
  .pin-glass { font-size: 40px; margin-bottom: 6px; }
  .pin-title { font-family: var(--font-display); font-weight:600; font-size:1.4rem; margin: 0 0 4px; }
  .pin-sub { color: var(--ink-faint); font-size: 13px; margin: 0 0 16px; }
  .pin-input { text-align:center; letter-spacing: 8px; font-size: 20px; margin-bottom: 10px; }
  .pin-error { color: var(--warn); font-size: 12.5px; min-height: 16px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="pin-gate" id="pinGate">
  <div class="pin-card">
    <div class="pin-glass">🥃</div>
    <h1 class="pin-title">Rum Klub</h1>
    <p class="pin-sub">Zadej PIN pro vstup</p>
    <input class="input pin-input" id="pinInput" type="password" inputmode="numeric" placeholder="••••" maxlength="12" autofocus>
    <div class="pin-error" id="pinError"></div>
    <button class="btn btn-primary" onclick="checkPin()">Odemknout</button>
  </div>
</div>
<header class="app-head">
  <div class="head-row">
    <div class="brand">
      <span class="brand-glass">🥃</span>
      <span class="brand-name">Rum Klub</span>
    </div>
    <div class="head-row" style="gap:10px;">
      <span class="sync-label" id="syncLabel"><span class="sync-dot" id="syncDot"></span>připojování…</span>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="rumy" onclick="goTab('rumy')">🥃 Rumy</button>
    <button class="tab-btn" data-tab="degustace" onclick="goTab('degustace')">➕ Hodnocení</button>
    <button class="tab-btn" data-tab="ucet" onclick="goTab('ucet')">💰 Účet</button>
    <button class="tab-btn" data-tab="wishlist" onclick="goTab('wishlist')">⭐ Wishlist</button>
    <button class="tab-btn" data-tab="klub" onclick="goTab('klub')">👥 Klub</button>
  </nav>
</header>

<main id="app">
  <div class="offline-note" id="offlineNote" hidden>
    <div class="big">🥃💤</div>
    <div>Tahle appka potřebuje živé propojení, které teď není k dispozici.<br>Zkus stránku otevřít znovu.</div>
  </div>

  <div class="view active" id="view-rumy">
    <h2 class="view-title">Rumy</h2>
    <div class="search-row">
      <input class="input" id="rumSearch" placeholder="Hledat podle názvu, značky, původu…" oninput="renderRumy()">
      <select class="input" id="rumSort" onchange="renderRumy()">
        <option value="score_desc">Nejlépe hodnocené</option>
        <option value="score_asc">Nejhůře hodnocené</option>
        <option value="name">Podle názvu</option>
        <option value="count">Podle počtu hodnocení</option>
        <option value="new">Nejnovější</option>
      </select>
    </div>
    <div id="rumList"></div>
  </div>

  <div class="view" id="view-degustace">
    <h2 class="view-title">Přidat hodnocení</h2>
    <div id="degustaceForm"></div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn btn-ghost" onclick="goTab('rumy')">← Zpět</button>
    </div>
    <div class="card" id="recentRatings" style="margin-top:16px;"></div>
  </div>

  <div class="view" id="view-ucet">
    <h2 class="view-title">Účet klubu</h2>
    <div class="card balance-hero">
      <div class="muted" style="font-size:12.5px;">aktuální zůstatek</div>
      <div class="num" id="ucetBalanceBig">–</div>
    </div>
    <div class="card">
      <div class="field"><label>Datum</label><input class="input" type="date" id="ucetDatum"></div>
      <div class="field"><label>Popis</label><input class="input" id="ucetPopis" placeholder="např. nákup rumů, platba za degustaci…"></div>
      <div class="row2">
        <div class="field"><label>Částka (Kč)</label><input class="input" type="number" id="ucetCastka" placeholder="1500" oninput="enforceNakupSign()"></div>
        <div class="field"><label>Kategorie</label>
          <select class="input" id="ucetKategorie" onchange="enforceNakupSign()">
            <option value="nákup">nákup</option>
            <option value="degustace">platba za degustaci</option>
            <option value="bonus">bonus</option>
            <option value="jiné">jiné</option>
          </select>
        </div>
      </div>
      <div class="muted" style="font-size:12px;margin:-6px 0 10px;">U kategorie "nákup" se částka automaticky počítá jako výdaj (záporná).</div>
      <button class="btn btn-primary" onclick="addLedger()">Přidat transakci</button>
    </div>
    <div class="card" id="ledgerList"></div>
  </div>

  <div class="view" id="view-wishlist">
    <h2 class="view-title">Wishlist</h2>
    <div class="filter-chips" id="wishFilters"></div>
    <button class="btn btn-ghost" id="wishToggleBtn" style="margin-bottom:12px;" onclick="toggleWishForm()">+ Přidat kandidáta</button>
    <div class="card" id="wishForm" hidden></div>
    <div id="wishList"></div>
  </div>

  <div class="view" id="view-klub">
    <h2 class="view-title">Klub</h2>
    <div id="memberList"></div>
    <div class="card" id="addMemberCard" style="margin-top:16px;">
      <div class="field"><label>Přidat člena</label>
        <div style="display:flex; gap:8px;">
          <input class="input" id="newMemberName" placeholder="Jméno">
          <button class="btn btn-primary btn-sm" onclick="addMember()" style="flex-shrink:0;">Přidat</button>
        </div>
      </div>
    </div>
    <div class="card muted" style="font-size:12.5px; margin-top:16px;" id="clubStats"></div>
    <button class="btn btn-ghost" id="exportBtn" style="margin-top:12px;" onclick="exportToExcel()">⬇️ Exportovat všechna data (Excel)</button>

let db = null;
let isGuest = false;
let isAdmin = false;
let currentUser = null;
let state = { members: [], rums: [], ratings: [], ledger: [], wishlist: [] };
let ui = {
  tab: 'rumy',
  selectedRatingRumId: null,
  selectedMember: null,
  scores: { barva: 15, aroma: 15, chut: 15, plnost: 15, dojezd: 15 },
  showNewRum: false,
  showNewMember: false,
  wishFilter: 'kandidát',
  wishFormOpen: false,
  detailRumId: null,
};

function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

function goTab(tab) {
  ui.tab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab));
  if (tab === 'degustace') renderDegustaceForm();
  if (tab === 'ucet') renderUcet();
  if (tab === 'wishlist') renderWishlist();
  if (tab === 'klub') renderKlub();
}

/* ---------------- derived data helpers ---------------- */
function ceilTo05(n) { return Math.ceil(n * 2) / 2; }

function ratingsForRum(rumId) {
  return state.ratings.filter(r => r.rumId === rumId);
}

function rumStats(rumId) {
  const rs = ratingsForRum(rumId);
  if (rs.length === 0) return null;
  const avg = (key) => ceilTo05(rs.reduce((s,r)=>s+(Number(r[key])||0),0) / rs.length);
  return {
    count: rs.length,
    barva: avg('barva'), aroma: avg('aroma'), chut: avg('chut'), plnost: avg('plnost'), dojezd: avg('dojezd'),
    celkem: avg('celkem'),
    perPerson: rs.map(r => ({clen: r.clen, celkem: r.celkem})),
  };
}

function scoreClass(score) {
  if (score == null) return 'score-none';
  if (score >= 95) return 'score-gold';
  if (score >= 90) return 'score-good';
  return 'score-mid';
}

function currentBalance() {
  return state.ledger.reduce((s,l)=>s + (Number(l.castka)||0), 0);
}

/* ---------------- RUMY tab ---------------- */
function renderRumy() {
  const search = (document.getElementById('rumSearch').value || '').toLowerCase();
  const sort = document.getElementById('rumSort').value;
  let rows = state.rums.map(r => ({ rum: r, stats: rumStats(r.id) }));
  if (search) {
    rows = rows.filter(({rum}) =>
      (rum.nazev||'').toLowerCase().includes(search) ||
      (rum.znacka||'').toLowerCase().includes(search) ||
      (rum.puvod||'').toLowerCase().includes(search)
    );
  }
  rows.sort((a,b) => {
    if (sort === 'name') return (a.rum.nazev||'').localeCompare(b.rum.nazev||'');
    if (sort === 'count') return (b.stats?.count||0) - (a.stats?.count||0);
    if (sort === 'new') return (b.rum._seq||0) - (a.rum._seq||0);
    const av = a.stats?.celkem ?? -1, bv = b.stats?.celkem ?? -1;
    return sort === 'score_asc' ? av - bv : bv - av;
  });

  const list = document.getElementById('rumList');
  if (rows.length === 0) {
    list.innerHTML = '<div class="empty-note">Žádný rum neodpovídá hledání.</div>';
    return;
  }
  list.innerHTML = rows.map(({rum, stats}, i) => {
    const subBits = [];
    if (rum.cena) subBits.push(esc(String(rum.cena))+' Kč');
    if (rum.abv) subBits.push(esc(String(rum.abv))+'% obj.');
    return `
    <div class="card rum-card" onclick="openRumDetail('${rum.id}')">
      <div class="rum-rank">${i+1}</div>
      <div class="rum-main">
        <div class="rum-name">${esc(rum.nazev)}${rum.znacka ? ' <span class="muted" style="font-weight:400;font-size:0.85em;">– '+esc(rum.znacka)+'</span>' : ''}</div>
        <div class="rum-sub">${rum.puvod ? '<span class="origin-badge">'+esc(rum.puvod)+'</span>' : ''}${subBits.join(' · ')}</div>
      </div>
      <div class="rum-score">
        <div class="num ${scoreClass(stats?.celkem)}">${stats ? stats.celkem : '–'}</div>
        <div class="cnt">${stats ? stats.count + ' hodn.' : 'bez hodnocení'}</div>
      </div>
    </div>
  `;
  }).join('');
}

function esc(s) {
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openRumDetail(rumId) {

  `;

function closeRumDetail() { document.getElementById('rumDetailOverlay').hidden = true; }

async function deleteRum(rumId) {
  if (!isAdmin) return;
  const rum = state.rums.find(r => r.id === rumId);
  if (!rum) return;
  const relatedRatings = state.ratings.filter(r => r.rumId === rumId);
  const warn = relatedRatings.length
    ? `Opravdu smazat rum "${rum.nazev}${rum.znacka?' – '+rum.znacka:''}"? Smaže se i všech ${relatedRatings.length} hodnocení k němu.`
    : `Opravdu smazat rum "${rum.nazev}${rum.znacka?' – '+rum.znacka:''}"?`;
  if (!confirm(warn)) return;
  const batch = db.batch();
  batch.delete(db.collection('rums').doc(rumId));
  relatedRatings.forEach(r => batch.delete(db.collection('ratings').doc(r.id)));
  await batch.commit();
  closeRumDetail();
  toast('Rum smazán');
  logChange('Smazán rum', `${rum.nazev}${rum.znacka?' – '+rum.znacka:''}${relatedRatings.length?' (+'+relatedRatings.length+' hodnocení)':''}`);
}

function presetRatingRum(rumId) {
  ui.selectedRatingRumId = rumId;

}

function renderDegustaceForm() {
  const rum = state.rums.find(r => r.id === ui.selectedRatingRumId);
  const crit = [['barva','Barva'],['aroma','Aroma'],['chut','Chuť'],['plnost','Plnost'],['dojezd','Dojezd']];
  const total = crit.reduce((s,[k])=>s+Number(ui.scores[k]||0),0);

  let dup = null;
  if (rum && ui.selectedMember) {
    dup = state.ratings.find(r => r.rumId === rum.id && r.clen === ui.selectedMember);
  }

  let html = '<div class="card">';
  html += '<div class="field"><label>1. Rum</label>';
  if (rum) {
    html += `<div class="selected-chip"><span>${esc(rum.nazev)} ${rum.znacka?'– '+esc(rum.znacka):''}</span><button class="x" onclick="ui.selectedRatingRumId=null; renderDegustaceForm();">×</button></div>`;
  } else {
    html += `<input class="input" id="rumPickSearch" placeholder="Hledat rum…" oninput="renderRatingRumPicker()">`;
    html += `<div class="picker-list" id="rumPickList"></div>`;
    if (!ui.showNewRum) {
      html += `<button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="ui.showNewRum=true; renderDegustaceForm();">+ Nový rum, který ještě není v seznamu</button>`;
    }
    if (ui.showNewRum) {
      html += `
        <div style="margin-top:10px;">
          <div class="field"><label>Značka rumu</label><input class="input" id="newRumNazev" placeholder="např. HAVANA CLUB"></div>
          <div class="row2">
            <div class="field"><label>Název rumu</label><input class="input" id="newRumZnacka" placeholder="Anejo Especial"></div>
            <div class="field"><label>Původ</label><input class="input" id="newRumPuvod" placeholder="Kuba"></div>
          </div>
          <div class="row2">
            <div class="field"><label>Cena</label><input class="input" type="number" id="newRumCena"></div>
            <div class="field"><label>Obsah alkoholu</label><input class="input" type="number" step="0.1" id="newRumAbv" placeholder="40"></div>
          </div>
          <div class="btn-row" style="margin-top:4px;">
            <button class="btn btn-primary btn-sm" onclick="createAndSelectRum()">Přidat rum</button>
            <button class="btn btn-ghost btn-sm" onclick="ui.showNewRum=false; renderDegustaceForm();">Zrušit</button>
          </div>
        </div>`;
    }
  }
  html += '</div>';

  if (rum) {
    html += '<div class="field"><label>2. Kdo hodnotí</label><div class="member-chips">';
    html += state.members.filter(m=>m.aktivni!==false).map(m => `<button class="member-chip ${ui.selectedMember===m.jmeno?'active':''}" onclick="ui.selectedMember='${esc(m.jmeno).replace(/'/g,"\\'")}'; renderDegustaceForm();">${esc(m.jmeno)}</button>`).join('');
    html += '</div>';
    html += `<button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="ui.showNewMember=!ui.showNewMember; renderDegustaceForm();">${ui.showNewMember?'Zrušit':'+ Nový člen'}</button>`;
    if (ui.showNewMember) {
      html += `<div style="display:flex; gap:8px; margin-top:8px;"><input class="input" id="quickMemberName" placeholder="Jméno"><button class="btn btn-primary btn-sm" onclick="quickAddMember()">Přidat</button></div>`;
    }
    html += '</div>';
  }

  if (rum && ui.selectedMember) {
    if (dup) {
      html += `<div class="warn-banner">${esc(ui.selectedMember)} už tenhle rum hodnotil/a (${dup.celkem} b.). Uložením staré hodnocení přepíšeš.</div>`;
    }
    html += '<div class="field"><label>3. Hodnocení (1–20 každé)</label>';
    crit.forEach(([k,label]) => {
      html += `
        <div class="slider-row">
          <div class="slider-head"><span>${label}</span><b id="scoreVal-${k}">${ui.scores[k]}</b></div>
          <input type="range" min="1" max="20" step="1" value="${ui.scores[k]}" oninput="updateScore('${k}', this.value)">
        </div>`;
    });
    html += '</div>';
    html += `<div class="total-box"><span class="muted">Celkem</span><span class="num">${total}</span></div>`;
    html += `<button class="btn btn-primary" onclick="submitRating()">${dup ? 'Přepsat hodnocení' : 'Uložit hodnocení'}</button>`;
  }
  html += '</div>';

  document.getElementById('degustaceForm').innerHTML = html;
  if (!rum) renderRatingRumPicker();
  renderRecentRatings();
}

function renderRatingRumPicker() {
  const el = document.getElementById('rumPickList');
  if (!el) return;
  const q = (document.getElementById('rumPickSearch')?.value || '').toLowerCase();
  let rows = state.rums;
  if (q) rows = rows.filter(r => (r.nazev||'').toLowerCase().includes(q) || (r.znacka||'').toLowerCase().includes(q));
  rows = rows.slice(0, 40);
  el.innerHTML = rows.map(r => `
    <div class="picker-item" onclick="ui.selectedRatingRumId='${r.id}'; renderDegustaceForm();">
      ${esc(r.nazev)} ${r.znacka?'– '+esc(r.znacka):''}
      <div class="sub">${esc(r.puvod||'')}</div>
    </div>
  `).join('') || '<div class="picker-item muted">Nic nenalezeno</div>';
}

function updateScore(key, val) {
  ui.scores[key] = Number(val);
  document.getElementById('scoreVal-'+key).textContent = val;
  const crit = ['barva','aroma','chut','plnost','dojezd'];
  const total = crit.reduce((s,k)=>s+Number(ui.scores[k]||0),0);
  const totalEl = document.querySelector('#degustaceForm .total-box .num');
  if (totalEl) totalEl.textContent = total;
  const btn = document.querySelector('#degustaceForm .btn-primary');
  // no full re-render needed for slider drags -> keeps UI snappy
}

      sheet.innerHTML = `
        <div class="sheet-head">

      const when = dt.toLocaleDateString('cs-CZ') + ' ' + dt.toLocaleTimeString('cs-CZ', {hour:'2-digit', minute:'2-digit'});
      return `
        <div class="ledger-row" style="cursor:default;">
          <div class="ledger-desc">
            <div><b>${esc(r.kdo||'?')}</b> — ${esc(r.akce||'')}</div>

      <div class="sheet-head">
        <h2 style="font-family:var(--font-display);font-weight:600;font-size:1.35rem;margin:0;">Přehled změn</h2>
        <button class="sheet-close" onclick="closeHistory()">×</button>

        <h2 style="font-family:var(--font-display);font-weight:600;font-size:1.35rem;margin:0;">Přehled změn</h2>

  const abv = document.getElementById('newRumAbv').value;

  const ref = await db.collection('rums').add(rum);
  ui.selectedRatingRumId = ref.id;

  ui.selectedMember = name;

}

async function submitRating() {
  const rum = state.rums.find(r => r.id === ui.selectedRatingRumId);
  if (!rum || !ui.selectedMember) return;
  const crit = ['barva','aroma','chut','plnost','dojezd'];
  const celkem = crit.reduce((s,k)=>s+Number(ui.scores[k]||0),0);
  const body = {
    rumId: rum.id, clen: ui.selectedMember,
    barva: ui.scores.barva, aroma: ui.scores.aroma, chut: ui.scores.chut,
    plnost: ui.scores.plnost, dojezd: ui.scores.dojezd, celkem,
    datum: new Date().toISOString().slice(0,10),
    _seq: Date.now(),
  };
  const existing = state.ratings.find(r => r.rumId === rum.id && r.clen === ui.selectedMember);
  if (existing) {
    await db.collection('ratings').doc(existing.id).set(body);
    toast('Hodnocení přepsáno');
    logChange('Upraveno hodnocení', `${ui.selectedMember} → ${rum.nazev}${rum.znacka?' – '+rum.znacka:''} (${celkem})`);
  } else {
    await db.collection('ratings').add(body);
    toast('Hodnocení uloženo');
    logChange('Přidáno hodnocení', `${ui.selectedMember} → ${rum.nazev}${rum.znacka?' – '+rum.znacka:''} (${celkem})`);
  }
  ui.selectedMember = currentUser || null;
  ui.scores = { barva: 15, aroma: 15, chut: 15, plnost: 15, dojezd: 15 };
  renderDegustaceForm();
}

function renderRecentRatings() {
  const el = document.getElementById('recentRatings');
  const recent = [...state.ratings].sort((a,b)=>(b._seq||0)-(a._seq||0)).slice(0,100);
  if (recent.length === 0) { el.innerHTML = ''; return; }
  const editable = !isGuest;
  el.innerHTML = '<div class="muted" style="font-size:12px;margin-bottom:6px;">Naposledy přidáno</div>' +
    '<div class="recent-list-scroll">' +
    recent.map(r => {
      const rum = state.rums.find(x=>x.id===r.rumId);
      const cls = 'recent-item' + (editable ? ' clickable' : '');
      const click = editable ? ` onclick="editRecentRating('${r.id}')"` : '';
      return `<div class="${cls}"${click}><span>${esc(r.clen)} – ${esc(rum?rum.nazev:'?')}</span><b>${r.celkem}</b></div>`;
    }).join('') +
    '</div>';
}

function editRecentRating(ratingId) {
  if (isGuest) return;
  const r = state.ratings.find(x => x.id === ratingId);

  ui.selectedRatingRumId = r.rumId;

  ui.scores = {
    barva: Number(r.barva)||15, aroma: Number(r.aroma)||15, chut: Number(r.chut)||15,
    plnost: Number(r.plnost)||15, dojezd: Number(r.dojezd)||15

function renderUcet() {
  const bal = currentBalance();
  const big = document.getElementById('ucetBalanceBig');
  big.textContent = Math.round(bal).toLocaleString('cs-CZ') + ' Kč';
  big.className = 'num ' + (bal < 0 ? 'neg' : 'pos');
  if (!document.getElementById('ucetDatum').value) {
    document.getElementById('ucetDatum').value = new Date().toISOString().slice(0,10);
  }

  const sorted = [...state.ledger].sort((a,b) => (a.datum||'').localeCompare(b.datum||'') || (a._seq||0)-(b._seq||0));
  let running = 0;
  const withBalance = sorted.map(l => { running += Number(l.castka)||0; return {...l, running}; });
  withBalance.reverse();

  document.getElementById('ledgerList').innerHTML = withBalance.length === 0
    ? '<div class="empty-note">Zatím žádné transakce.</div>'
    : withBalance.map(l => `
      <div class="ledger-row" onclick="openLedgerEdit('${l.id}')">
        <div class="ledger-desc">
          <div>${esc(l.popis)}</div>
          <div class="ledger-date">${esc(l.datum||'')} · ${esc(l.kategorie||'')}</div>
        </div>
        <div>
          <div class="ledger-amt ${l.castka<0?'neg':'pos'}">${l.castka>0?'+':''}${Math.round(l.castka).toLocaleString('cs-CZ')} Kč</div>
          <span class="ledger-bal">zůst. ${Math.round(l.running).toLocaleString('cs-CZ')}</span>
        </div>
      </div>
    `).join('');

  updateBalanceChip();
}

function enforceNakupSign() {
  const kat = document.getElementById('ucetKategorie').value;
  const inp = document.getElementById('ucetCastka');

async function addLedger() {
  const datum = document.getElementById('ucetDatum').value;
  const popis = document.getElementById('ucetPopis').value.trim();
  let castka = Number(document.getElementById('ucetCastka').value);
  const kategorie = document.getElementById('ucetKategorie').value;
  if (!popis || !castka) { toast('Vyplň popis a částku'); return; }
  if (kategorie === 'nákup' && castka > 0) castka = -castka;
  await db.collection('ledger').add({ datum, popis, castka, kategorie, _seq: Date.now() });
  document.getElementById('ucetPopis').value = '';
  document.getElementById('ucetCastka').value = '';

}

  let rows = state.wishlist;
  if (ui.wishFilter !== 'vše') rows = rows.filter(w => (w.stav||'kandidát') === ui.wishFilter);
  const list = document.getElementById('wishList');
  if (rows.length === 0) { list.innerHTML = '<div class="empty-note">Nic tu není.</div>'; return; }
  list.innerHTML = rows.map(w => {
    const subParts = [];
    if (w.abv) subParts.push(esc(String(w.abv))+'% obj.');
    if (w.puvod) subParts.push('<span class="origin-badge">'+esc(w.puvod)+'</span>');
    if (w.cena) subParts.push(esc(String(w.cena))+' Kč');
    if (w.cukr!=null) subParts.push('cukr '+esc(String(w.cukr))+' g/l');
    return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <div class="rum-name">${esc(w.znacka)} ${w.nazev?'<span class="muted" style="font-weight:400;">– '+esc(w.nazev)+'</span>':''}</div>
          <div class="rum-sub">${subParts.join(' · ')}</div>
          ${w.poznamka ? '<div class="muted" style="font-size:12.5px;margin-top:4px;">'+esc(w.poznamka)+'</div>' : ''}
        </div>
        <span class="status-pill status-${(w.stav||'kandidát').replace('á','a').replace('í','i')}">${esc(w.stav||'kandidát')}</span>
      </div>
      ${isGuest ? '' : `
      <div class="btn-row" style="margin-top:10px; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" style="flex:0 0 auto;" onclick="setWishStatus('${w.id}','kandidát')">Kandidát</button>
        <button class="btn btn-ghost btn-sm" style="flex:0 0 auto;" onclick="setWishStatus('${w.id}','koupeno')">Koupeno</button>
        <button class="btn btn-ghost btn-sm" style="flex:0 0 auto;" onclick="setWishStatus('${w.id}','zamítnuto')">Zamítnuto</button>
        <button class="btn btn-danger btn-sm" style="flex:0 0 auto;" onclick="deleteWish('${w.id}')">Smazat</button>
      </div>
      `}
    </div>
  `;
  }).join('');
}

/* ---------------- KLUB tab ---------------- */
async function addMember() {
  const name = document.getElementById('newMemberName').value.trim();
  if (!name) return;
  await db.collection('members').add({ jmeno: name, aktivni: true });
  document.getElementById('newMemberName').value = '';
  toast('Člen přidán');
  logChange('Přidán člen', name);
}

const CLUB_MEMBER_ORDER = ['Broněk','Libor','Jirka','Tonda','Tomáš','Mirek','Host 1','Host 2'];
function renderKlub() {
  const list = document.getElementById('memberList');
  const sortedMembers = [...state.members].sort((a,b) => {
    const ia = CLUB_MEMBER_ORDER.indexOf(a.jmeno), ib = CLUB_MEMBER_ORDER.indexOf(b.jmeno);
    const ra = ia === -1 ? CLUB_MEMBER_ORDER.length : ia;
    const rb = ib === -1 ? CLUB_MEMBER_ORDER.length : ib;
    if (ra !== rb) return ra - rb;
    return (a.jmeno||'').localeCompare(b.jmeno||'');
  });
  list.innerHTML = sortedMembers.map(m => {
    const rs = state.ratings.filter(r => r.clen === m.jmeno);
    const avg = rs.length ? (rs.reduce((s,r)=>s+Number(r.celkem||0),0)/rs.length).toFixed(1) : '–';
    return `
      <div class="card member-card">
        <div>
          <div class="rum-name">${esc(m.jmeno)}</div>
          <div class="member-stats">${rs.length} hodnocení · průměr ${avg}</div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('clubStats').innerHTML =
    `Celkem v katalogu: <b>${state.rums.length}</b> rumů · <b>${state.ratings.length}</b> hodnocení · <b>${state.members.length}</b> členů`;
}


/* ---------------- EXPORT DO EXCELU ---------------- */
function exportToExcel() {
  if (typeof XLSX === 'undefined') { toast('Export se nepodařilo načíst, zkus obnovit stránku'); return; }
  const wb = XLSX.utils.book_new();
  const addSheet = (name, rows) => {
    const clean = rows.map(r => { const { id, ...rest } = r; return { id, ...rest }; });
    const ws = XLSX.utils.json_to_sheet(clean);
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  addSheet('Clenove', state.members);
  addSheet('Rumy_katalog', state.rums);
  addSheet('Hodnoceni', state.ratings);
  addSheet('Ucet', state.ledger);
  addSheet('Wishlist', state.wishlist);
  const datum = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `rum-klub-export-${datum}.xlsx`);
  toast('Export stažen');
}

function fromSnap(snap) { return snap.docs.map(d => ({ id: d.id, ...d.data() })); }

async function maybeSeed() {
  const seedRef = db.doc('meta/seed');
  const snap = await seedRef.get();
  if (snap.exists) return;
  const jobs = [];
  SEED.members.forEach(m => jobs.push(db.collection('members').doc(m.id).set(m)));
  SEED.rums.forEach((r,i) => jobs.push(db.collection('rums').doc(r.id).set({...r, _seq: i})));
  SEED.ratings.forEach((r,i) => jobs.push(db.collection('ratings').doc(r.id).set({...r, _seq: i})));
  SEED.ledger.forEach((l,i) => jobs.push(db.collection('ledger').doc(l.id).set({...l, _seq: i})));
  SEED.wishlist.forEach((w,i) => jobs.push(db.collection('wishlist').doc(w.id).set({...w, _seq: i})));
  await Promise.all(jobs);
  await seedRef.set({ done: true, at: new Date().toISOString() });
}

function subscribeAll() {
  db.collection('members').onSnapshot(snap => { state.members = fromSnap(snap); rerenderActive(); },
    () => toast('Chyba při načítání členů'));
  db.collection('rums').onSnapshot(snap => { state.rums = fromSnap(snap); rerenderActive(); },
    () => toast('Chyba při načítání rumů'));
  db.collection('ratings').onSnapshot(snap => { state.ratings = fromSnap(snap); rerenderActive(); },
    () => toast('Chyba při načítání hodnocení'));
  db.collection('ledger').onSnapshot(snap => { state.ledger = fromSnap(snap); updateBalanceChip(); rerenderActive(); },
    () => toast('Chyba při načítání účtu'));
  db.collection('wishlist').onSnapshot(snap => { state.wishlist = fromSnap(snap); rerenderActive(); },
    () => toast('Chyba při načítání wishlistu'));
}

function rerenderActive() {
  if (ui.tab === 'rumy') renderRumy();
  else if (ui.tab === 'degustace') renderDegustaceForm();
  else if (ui.tab === 'ucet') renderUcet();
  else if (ui.tab === 'wishlist') renderWishlist();
  else if (ui.tab === 'klub') renderKlub();
}


async function init() {
  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('SEM_VLOZ') === 0) {
    document.getElementById('offlineNote').hidden = false;
    document.getElementById('offlineNote').innerHTML =
      '<div class="big">🥃⚙️</div><div>Appka ještě není nastavená.<br>Otevři soubor <code>index.html</code> a do <code>FIREBASE_CONFIG</code> na začátku &lt;script&gt; vlož údaje ze svého Firebase projektu (návod je v README-NASAZENI.md).</div>';
    document.getElementById('syncLabel').innerHTML = '<span class="sync-dot"></span>nenastaveno';
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    try {
      await firebase.auth().signInAnonymously();
    } catch (authErr) {
      console.error('Anonymní přihlášení selhalo (zkontroluj, že je v Firebase konzoli zapnuté Authentication -> Sign-in method -> Anonymous):', authErr);
    }
    db = firebase.firestore();
  } catch (e) {
    console.error('Firebase se nepodařilo inicializovat:', e);
    db = null;
  }
  if (!db) {
    document.getElementById('offlineNote').hidden = false;
    document.getElementById('syncLabel').innerHTML = '<span class="sync-dot"></span>offline';
    return;
  }
  document.getElementById('syncLabel').innerHTML = '<span class="sync-dot live"></span>databáze';
  try {
    await maybeSeed();
  } catch(e) { /* seeding races are harmless; ignore */ console.error('Seed:', e); }
  subscribeAll();
}

/* ---------------- PIN zámek ---------------- */
function applyGuestRestrictions() {
  if (!isGuest) return;
  ['degustace','ucet'].forEach(tab => {
    const btn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
    if (btn) btn.hidden = true;
  });
  const addMemberCard = document.getElementById('addMemberCard');
  if (addMemberCard) addMemberCard.hidden = true;
  const wishToggleBtn = document.getElementById('wishToggleBtn');
  if (wishToggleBtn) wishToggleBtn.hidden = true;
  const exportBtn = document.getElementById('exportBtn');
  if (exportBtn) exportBtn.hidden = true;
}

function applyAdminFeatures() {
  const historyBtn = document.getElementById('historyBtn');
  if (historyBtn) historyBtn.hidden = !isAdmin;
}

function startApp() {
  if (currentUser) ui.selectedMember = currentUser;
  renderRumy();
  applyGuestRestrictions();
  applyAdminFeatures();
  init();
}

function saveSession(role, user) {
  try { localStorage.setItem('rumklub_session', JSON.stringify({ role, user })); } catch(e) {}
}

function checkPin() {
  const val = document.getElementById('pinInput').value.trim();
  const err = document.getElementById('pinError');
  const memberName = Object.keys(MEMBER_PINS).find(name => MEMBER_PINS[name] === val && val !== '');
  if (val && val === APP_PIN) {
    isGuest = false; isAdmin = true; currentUser = null;
    saveSession('admin', null);
  } else if (val && memberName) {
    isGuest = false; isAdmin = false; currentUser = memberName;
    saveSession('member', memberName);
  } else if (val && val === GUEST_PIN) {
    isGuest = true; isAdmin = false; currentUser = null;
    saveSession('guest', null);
  } else {
    err.textContent = 'Špatný PIN, zkus to znovu.';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
    return;
  }
  document.getElementById('pinGate').hidden = true;
  startApp();
}

function lockApp() {
  try { localStorage.removeItem('rumklub_session'); localStorage.removeItem('rumklub_pin_ok'); } catch(e) {}
  location.reload();
}

document.addEventListener('DOMContentLoaded', () => {
  const gate = document.getElementById('pinGate');
  const pinInput = document.getElementById('pinInput');
  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
  let session = null;
  try {
    const raw = localStorage.getItem('rumklub_session');
    if (raw) session = JSON.parse(raw);
    else if (localStorage.getItem('rumklub_pin_ok') === '1') session = { role: 'admin', user: null }; // starší appka před osobními kódy
  } catch(e) {}
  if (session && (session.role === 'admin' || session.role === 'member' || session.role === 'guest')) {
    isAdmin = session.role === 'admin';
    isGuest = session.role === 'guest';
    currentUser = session.role === 'member' ? session.user : null;
    gate.hidden = true;
    startApp();
  } else {
    gate.hidden = false;
    pinInput.focus();
  }
});
</script>
